name: Release

# Every branch push publishes a fresh release; the previous one (and its tag) is
# deleted so only the latest build is ever listed.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write      # needed to create a GitHub Release
  id-token: write      # Sigstore keyless signing (binary transparency)
  attestations: write  # store the provenance attestation

# Rapid successive pushes: only the newest one gets to publish.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from app/build.gradle.kts
        id: version
        run: |
          NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)"
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::versionName/versionCode not found in app/build.gradle.kts"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default is "tools platform-tools"; Google removed the
          # obsolete "tools" package from the SDK repository, so the default makes
          # sdkmanager exit 1. No NDK/CMake needed: inference is pure Kotlin.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: disabled  # avoids classpath artifacts
          cache-read-only: true  # reuse CI's cache without churning it

      # Restores the same keystore the local build uses (generate-keystore-and-build.sh):
      # upload-keystore.jks + keystore.properties, which app/build.gradle.kts picks up.
      # Without the secrets the APK stays unsigned (app-release-unsigned.apk) — fine
      # for a dry run, not for a real release.
      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD); the APK will remain unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifacts and generate checksums
        run: |
          cd app/build/outputs/apk/release
          mv app-release*.apk "faceblur-${{ steps.version.outputs.name }}.apk"
          sha256sum -- *.apk > SHA256SUMS
          cat SHA256SUMS

      # An unsigned APK cannot be installed, and publishing deletes the previous
      # release: stop here rather than replace a working build with a broken one.
      - name: Verify APK signature
        id: signature
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:?}/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          APK="$(echo app/build/outputs/apk/release/*.apk)"
          if ! OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"; then
            echo "$OUTPUT"
            echo "::error::$APK is not signed; check the KEYSTORE_* secrets. Previous release kept."
            exit 1
          fi
          echo "$OUTPUT"
          CERT="$(grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' <<< "$OUTPUT" | head -n 1)"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: \`$CERT\`" >> "$GITHUB_STEP_SUMMARY"

      # Binary transparency: record each artifact's digest, bound to this exact
      # workflow run, in the public Sigstore transparency log (Rekor). Verify with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      # Attestations on private repos need GitHub Enterprise Cloud, so public only.
      - name: Attest release artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS

      - name: Replace previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
          CERT: ${{ steps.signature.outputs.cert }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --yes
              # F-Droid builds from the v<version> tags: never delete those. Other
              # tags may already be gone (force push), so a failed delete is fine.
              if [[ ! "$tag" =~ ^v[0-9.]+$ ]]; then
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" || true
              fi
            done
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "v${VERSION}-${SHORT_SHA}" \
            --target "$GITHUB_SHA" \
            --title "FaceBlur ${VERSION} (${GITHUB_REF_NAME}@${SHORT_SHA})" \
            --notes "$(git log -1 --format=%B "$GITHUB_SHA")

          Signing certificate SHA-256: \`${CERT}\`" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/release/SHA256SUMS
