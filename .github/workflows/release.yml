name: Release

# Pushing a v<versionName> tag publishes a permanent release named after the tag,
# with faceblur-<versionName>.apk built from the tagged commit. F-Droid downloads
# that APK (Binaries: in its metadata) and checks it against its own build of the
# same tag, so a published release is never replaced or deleted.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # needed to create a GitHub Release
  id-token: write      # Sigstore keyless signing (binary transparency)
  attestations: write  # store the provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag must name the version being built: F-Droid maps v<versionName> to
      # releases/download/v<versionName>/faceblur-<versionName>.apk.
      - name: Read version and check it matches the tag
        id: version
        run: |
          NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)"
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::versionName/versionCode not found in app/build.gradle.kts"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v${NAME}" ]; then
            echo "::error::Run on tag v${NAME} (got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME})."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; F-Droid relies on it staying unchanged."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default is "tools platform-tools"; Google removed the
          # obsolete "tools" package from the SDK repository, so the default makes
          # sdkmanager exit 1. No NDK/CMake needed: inference is pure Kotlin.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: disabled  # avoids classpath artifacts
          cache-read-only: true  # reuse CI's cache without churning it

      # Restores the same keystore the local build uses (generate-keystore-and-build.sh):
      # upload-keystore.jks + keystore.properties, which app/build.gradle.kts picks up.
      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifacts and generate checksums
        run: |
          cd app/build/outputs/apk/release
          mv app-release*.apk "faceblur-${{ steps.version.outputs.name }}.apk"
          sha256sum -- *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Verify APK signature
        id: signature
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:?}/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          APK="$(echo app/build/outputs/apk/release/*.apk)"
          if ! OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"; then
            echo "$OUTPUT"
            echo "::error::$APK is not signed; check the KEYSTORE_* secrets."
            exit 1
          fi
          echo "$OUTPUT"
          CERT="$(grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' <<< "$OUTPUT" | head -n 1)"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: \`$CERT\`" >> "$GITHUB_STEP_SUMMARY"

      # Binary transparency: record each artifact's digest, bound to this exact
      # workflow run, in the public Sigstore transparency log (Rekor). Verify with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      # Attestations on private repos need GitHub Enterprise Cloud, so public only.
      - name: Attest release artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          CERT: ${{ steps.signature.outputs.cert }}
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [ -f "$CHANGELOG" ]; then NOTES="$(cat "$CHANGELOG")"; else NOTES="$(git log -1 --format=%B)"; fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "FaceBlur ${VERSION}" \
            --notes "${NOTES}

          Signing certificate SHA-256: \`${CERT}\`" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/release/SHA256SUMS
