name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # needed to create a GitHub Release
  id-token: write      # Sigstore keyless signing (binary transparency)
  attestations: write  # store the provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from app/build.gradle.kts
        id: version
        run: |
          NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)"
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::versionName/versionCode not found in app/build.gradle.kts"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          EXPECTED="v${{ steps.version.outputs.name }}"
          ACTUAL="${GITHUB_REF_NAME}"
          echo "expected tag ${EXPECTED}; pushed tag ${ACTUAL}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag ${ACTUAL} does not match versionName (${EXPECTED}). Bump versionName/versionCode in app/build.gradle.kts, or tag exactly ${EXPECTED}."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default is "tools platform-tools"; Google removed the
          # obsolete "tools" package from the SDK repository, so the default makes
          # sdkmanager exit 1. No NDK/CMake needed: inference is pure Kotlin.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: disabled  # avoids classpath artifacts
          cache-read-only: true  # tag runs reuse main's cache without churning it

      # Restores the same keystore the local build uses (generate-keystore-and-build.sh):
      # upload-keystore.jks + keystore.properties, which app/build.gradle.kts picks up.
      # Without the secrets the APK falls back to the debug key — fine for a dry run,
      # not for a real release.
      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD); the APK will be signed with the debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifacts and generate checksums
        run: |
          cd app/build/outputs/apk/release
          mv app-release.apk "faceblur-${{ steps.version.outputs.name }}.apk"
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      # Binary transparency: record each artifact's digest, bound to this exact
      # workflow run, in the public Sigstore transparency log (Rekor). Verify with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
