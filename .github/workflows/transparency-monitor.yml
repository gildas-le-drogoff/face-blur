name: Transparency monitor

# Acts as an independent-ish transparency monitor: fetches the LIVE published
# F-Droid repository the way any user would and verifies it against the public
# Sigstore transparency log, the append-only fdroid-repo branch, and the pinned
# signing certificate. A failure means users may be receiving artifacts that CI
# never built — it opens an issue immediately.
#
# (Anyone can run the same check from anywhere: scripts/verify-transparency.sh.)

on:
  schedule:
    - cron: '17 6 * * *'  # daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # to raise the alarm

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify live repository against the transparency log
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-transparency.sh

      - name: Raise the alarm
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Transparency check FAILED: published repo does not match CI-built artifacts"
          # Don't stack duplicates while an alarm is already open.
          if [ -z "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')" ]; then
            gh label create security --color B60205 2>/dev/null || true  # must exist for --label
            gh issue create --title "$TITLE" --label security --body \
              "The scheduled transparency monitor found that the live published repository does not match what CI built and logged in the Sigstore transparency log (or the append-only branch history). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Until resolved, treat the published repository as untrusted."
          fi
