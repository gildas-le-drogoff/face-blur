name: Pages

# Publishes the project site (tools/build-site.sh) built from the fastlane
# metadata, so it always shows the same texts and screenshots as F-Droid.
on:
  push:
    branches: [main]
    paths:
      - fastlane/**
      - tools/build-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No actions/configure-pages: the site only uses relative links, so it needs
      # no base URL, and the step would require the pages permission here.
      - name: Build site
        run: tools/build-site.sh _site

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # deploy to GitHub Pages
      id-token: write  # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
