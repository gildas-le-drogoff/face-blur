version = 1

# Within one REUSE.toml the LAST matching table wins, so the catch-all comes
# first and the more specific annotations follow.

# Project code, resources, build files and documentation.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Gildas Le Drogoff and FaceBlur contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# YuNet face detection model (OpenCV Zoo), embedded as-is with its checksum.
[[annotations]]
path = "app/src/main/assets/face_detection_yunet_2026may.onnx"
SPDX-FileCopyrightText = "2020 Shiqi Yu"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "app/src/main/assets/face_detection_yunet_2026may.onnx.sha256"
SPDX-FileCopyrightText = "2020 Shiqi Yu"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "app/src/main/assets/face_detection_yunet_2026may.LICENSE.txt"
SPDX-FileCopyrightText = "2020 Shiqi Yu"
SPDX-License-Identifier = "MIT"

# Material Symbols icons downloaded via add-material-symbols.
[[annotations]]
path = "app/src/main/res/drawable/ic_*.xml"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

# Launcher icons are original work of this project.
[[annotations]]
path = "app/src/main/res/drawable/ic_launcher_*.xml"
SPDX-FileCopyrightText = "2026 Gildas Le Drogoff"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Gradle wrapper binary.
[[annotations]]
path = "gradle/wrapper/gradle-wrapper.jar"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"
